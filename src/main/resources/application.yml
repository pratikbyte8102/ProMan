spring:
  application:
    name: proman
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proman}
    username: ${DATABASE_USERNAME:proman}
    password: ${DATABASE_PASSWORD:proman}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:my-256-bit-secret-key-for-development-only-change-in-prod}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
